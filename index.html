<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Guildmaster: run an adventurers' guild, manage stress and stories, and slay the final boss.">
<meta name="theme-color" content="#0e1216">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230e1216'/%3E%3Cpath d='M3 0h2v1h1v1H5v3h1v1H5v2H3V6H2V5h1V2H2V1h1z' fill='%23d4aa4f'/%3E%3C/svg%3E">
<title>Guildmaster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&display=swap">
<style>
/* Layout: sticky day/gold/End Day bar, rank panel, five tabs (Quests, Parties, Roster, Tavern, Guild), ledger at the bottom. Single dark look, brass accent on blue-black. */
:root{
  --bg:#0e1216; --panel:#161c22; --panel2:#1d252d; --line:#2b3640;
  --fg:#e7e1d1; --mute:#93a0ab; --brass:#d4aa4f; --brass-ink:#1a1405;
  --good:#7fb069; --warn:#e2a93b; --bad:#dc6652; --dread:#a566c9;
  --t0:#a3adb5; --t1:#72c177; --t2:#5ea6ec; --t3:#b97cef; --t4:#f3a93c;
  --display:'Pirata One',Georgia,serif; --body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.small{padding:4px 9px;font-size:14px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.mute{color:var(--mute)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:28px;color:var(--brass);line-height:1;margin-right:auto}
.chip{display:flex;flex-direction:column;line-height:1.1}
.chip small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.chip b{font-size:20px;font-weight:700}
.neg{color:var(--bad)}

/* rank */
.rank{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;padding-block:16px}
.rletter{font-family:var(--display);font-size:54px;line-height:.9;color:var(--brass);min-width:48px;text-align:center}
.rname{font-size:20px;font-family:var(--display)}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brass)}
.rinfo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--mute)}
.rinfo b{color:var(--fg);font-weight:500}
.era{color:var(--dread)!important}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--brass)}
.tab em{font-style:normal;color:var(--brass);margin-left:4px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.sect:first-child{margin-top:0}
.sect h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:8px;color:var(--mute);text-align:center}

/* quest card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.crisis{border-color:var(--bad);background:linear-gradient(180deg,#2e1512,var(--panel) 75%)}
.crisisbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 12px;border:1px solid var(--bad);border-radius:8px;background:#2a1614}
.crisisbar b{color:var(--bad)}
.crisisbar.hot{animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{background:#4a1c18}}
@media (prefers-reduced-motion:reduce){.crisisbar.hot{animation:none}}
.card.boss{border-color:var(--bad);background:linear-gradient(180deg,#2a1614,var(--panel) 70%)}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qtitle{font-family:var(--display);font-size:21px;line-height:1.15;min-width:0}
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.card.boss .qtype{color:var(--bad);font-weight:700}
.pips{display:flex;gap:2px;align-items:center}
.pips i{width:8px;height:8px;transform:rotate(45deg);background:var(--line)}
.pips i.on{background:var(--bad)}
.dlabel{white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--bad);font-weight:700;text-align:right}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.need{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.rew{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.rew b{color:var(--brass)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}

/* hero */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;min-width:0}
.hero.compact{background:var(--panel2)}
.hmain{min-width:0}
.hname{font-weight:700;font-size:17px;line-height:1.15;overflow-wrap:anywhere}
.hname.t0{color:var(--t0)} .hname.t1{color:var(--t1)} .hname.t2{color:var(--t2)} .hname.t3{color:var(--t3)} .hname.t4{color:var(--t4)}
.hsub{font-size:13px;color:var(--mute)}
.hstats{display:flex;gap:10px;margin-top:3px;font-size:12px;color:var(--mute);letter-spacing:.05em}
.hstats b{color:var(--fg);font-size:15px;margin-right:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);cursor:help}
.tag.pos{color:var(--good);border-color:#3c5a35} .tag.neg{color:var(--bad);border-color:#6a3a32}
.tag.aff{color:#fff;background:#6a2a2a;border-color:var(--bad);font-weight:700}
.tag.vir{color:var(--brass-ink);background:var(--brass);border-color:var(--brass);font-weight:700}
.stress{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.stress i{display:block;height:100%;background:var(--dread)}
.stress.mid i{background:var(--warn)} .stress.hi i{background:var(--bad)}
.xp{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--brass)}
.hside{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.good{color:var(--good);border-color:var(--good)}
.cinfo{font-size:13px;color:var(--mute)}

/* party */
.party{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.phead h3{font-size:22px}
.slot-add{border:1px dashed var(--line);background:none;border-radius:8px;padding:12px;color:var(--mute);font-weight:500}
.slot-add:hover{border-color:var(--brass);color:var(--fg)}
.ptotals{display:flex;gap:14px;font-size:13px;color:var(--mute);flex-wrap:wrap;padding-top:2px}
.ptotals b{color:var(--fg);font-size:15px}

/* odds */
.odds{display:flex;align-items:center;gap:8px;min-width:0}
.obar{flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.obar i{display:block;height:100%}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
i.good{background:var(--good)} i.warn{background:var(--warn)} i.bad{background:var(--bad)}
.odds b{min-width:3.2em;text-align:right}

/* sprites + mission tracks */
.spr{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--t0)}
.spr.t1{border-color:var(--t1)} .spr.t2{border-color:var(--t2)} .spr.t3{border-color:var(--t3)} .spr.t4{border-color:var(--t4)}
.pix{display:block;image-rendering:pixelated}
.track{position:relative;height:84px;margin:4px 46px 0}
.rail,.fill{position:absolute;left:0;bottom:11px;height:8px;border-radius:4px}
.rail{right:0;background:var(--panel2);border:1px solid var(--line)}
.fill{background:var(--brass);transition:width .12s linear}
.node{position:absolute;bottom:2px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.node.good{border-color:var(--good)} .node.bad{border-color:var(--bad)} .node.pending{border-color:var(--brass);color:var(--brass);font-weight:700}
.node.unk{opacity:.6;color:var(--mute);font-weight:700;font-size:13px}
.node.goal{opacity:.75}
.node.new{animation:pop .4s 1.5s both}
.runner{position:absolute;bottom:26px;display:flex;transform:translateX(-50%);transition:left .12s linear;z-index:2}
.runner .pix{animation:bob .5s steps(2) infinite}
.runner .pix:nth-child(2){animation-delay:.12s} .runner .pix:nth-child(3){animation-delay:.24s} .runner .pix:nth-child(4){animation-delay:.36s}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.mstress{display:flex;gap:8px;flex-wrap:wrap}
.mstress div{flex:1;min-width:70px}
.mstress small{font-size:11px;color:var(--mute);display:block}
.mlog{display:flex;flex-direction:column;gap:6px;font-size:14px}
.mlog>div{display:flex;gap:8px;align-items:center}
.mlog .pix{flex:none}
.mlog b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.runner .pix,.node.new{animation:none}.fill,.runner{transition:none}}

/* guild hall */
.bld{display:flex;flex-direction:column;gap:8px}
.bpips{display:flex;gap:4px}
.bpips i{width:14px;height:8px;border-radius:2px;background:var(--line)}
.bpips i.on{background:var(--brass)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.panel h3{font-size:22px}
.panel.dread{border-color:var(--dread)}

/* ledger + footer */
.ledger{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.ledger h2{font-size:22px;margin-bottom:8px}
.ledger ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ledger li{color:var(--mute)}
.ledger li span{color:var(--brass);margin-right:8px;font-weight:700}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* modal */
.back{position:fixed;inset:0;z-index:40;background:rgba(5,8,11,.78);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--brass);border-radius:10px;width:100%;max-width:600px;max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.dark{border-color:var(--dread)}
.modal h2{font-size:28px;color:var(--brass)}
.modal.dark h2{color:var(--dread)}
.modal p{margin:0}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.mact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ev{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ev li{padding:8px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.ev li.win{border-color:var(--good)} .ev li.loss{border-color:var(--bad)} .ev li.death{border-color:var(--bad);background:#2a1614}
.ev li.rank,.ev li.lvl{border-color:var(--brass)}
.arow{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.arow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.names{font-size:14px;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;gap:12px;align-items:center}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt small{color:var(--mute);white-space:nowrap}
.opt small.safe{color:var(--good)} .opt small.risky{color:var(--bad)} .opt small.even{color:var(--warn)}
.opt small.need{color:var(--mute)}
/* live clock */
.speed{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.speed button{background:var(--panel2);border:0;border-right:1px solid var(--line);padding:6px 11px;font-weight:700;color:var(--mute)}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--brass);color:var(--brass-ink)}
.daymeter{flex-basis:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.daymeter i{display:block;height:100%;background:var(--brass)}
#toasts{position:fixed;z-index:35;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:420px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.toast.win{border-color:var(--good)} .toast.loss{border-color:var(--bad)} .toast.lvl{border-color:var(--brass)}
/* reputation + backstory */
.tag.story{color:var(--brass);border-color:var(--brass-d,#8d6f2b)}
.rep{font-size:12px;margin-top:4px;color:var(--mute)}
.rep b{font-weight:700}
.r-top{color:var(--t4)} .r-high{color:var(--good)} .r-mid{color:var(--mute)} .r-low{color:var(--warn)} .r-bad{color:var(--bad)}
.chap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.chap p{margin:0}
.chap.pend{border-color:var(--brass)}
.chap.lock{opacity:.6;font-style:italic}
.chead{font-family:var(--display);font-size:19px;color:var(--brass)}
.sopt{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.sopt:hover{border-color:var(--brass)}
.sopt>b{font-family:var(--display);font-weight:400;font-size:20px}
.stext{font-size:15px;line-height:1.4}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.slot-add,.opt,.sopt{transition:border-color .15s,filter .15s}}

body{margin:0}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* ---------- data ---------- */
const STATS=['might','magic','agility','wits'];
const SL={might:'Might',magic:'Magic',agility:'Agility',wits:'Wits'};
const SS={might:'MIT',magic:'MAG',agility:'AGI',wits:'WIT'};
const CLASSES={
  warrior:{n:'Warrior',base:{might:8,magic:1,agility:3,wits:2},role:'Front-line bruiser. Huge Might.'},
  mage:{n:'Mage',base:{might:1,magic:8,agility:2,wits:3},role:'Spell damage. Huge Magic.'},
  rogue:{n:'Rogue',base:{might:3,magic:1,agility:8,wits:3},role:'Fast and sneaky. Huge Agility.'},
  cleric:{n:'Cleric',base:{might:2,magic:5,agility:2,wits:5},role:'Healer. Halves injury and death risk for the whole party.'},
  ranger:{n:'Ranger',base:{might:4,magic:2,agility:6,wits:4},role:'Well-rounded archer.'},
  paladin:{n:'Paladin',lock:true,base:{might:6,magic:3,agility:1,wits:4},role:'Holy knight. Party gains 15% less stress.'},
  bard:{n:'Bard',lock:true,base:{might:1,magic:3,agility:4,wits:7},role:'Calms nerves. Party gains 20% less stress.'}
};
const TIERS=[
  {n:'Common',mult:1,hire:60,wage:2},{n:'Uncommon',mult:1.6,hire:180,wage:5},
  {n:'Rare',mult:2.5,hire:550,wage:12},{n:'Epic',mult:4,hire:1700,wage:30},{n:'Legendary',mult:6.5,hire:5500,wage:70}
];
const RT=[0,40,150,400,900,1800,3500,6500];
const RANKS=[{l:'F',n:'Ragged Tavern'},{l:'E',n:'Local Hall'},{l:'D',n:'Town Guild'},{l:'C',n:'Regional Guild'},{l:'B',n:'Famed Guild'},{l:'A',n:'Grand Guild'},{l:'S',n:'Royal Guild'},{l:'SS',n:'Legendary Guild'}];
const TIER_CAP=[0,1,1,2,2,3,3,4];
const BOSS_RANK=6;
const FIRST=['Aldric','Brea','Cael','Dara','Edda','Fenn','Garrick','Hana','Isolde','Joren','Kestrel','Lyra','Marek','Nessa','Orin','Pell','Quill','Rhea','Soren','Tamsin','Ulric','Vesper','Wren','Yara','Zeph','Bram','Corin','Dunya','Eryk','Freya'];
const EPI=['the Unbroken','Ashbringer','of the Hollow','Stormcaller','the Grim','Dawnwarden','Oathkeeper','the Pale','Gravewalker','Emberhand','the Swift','Skyrender'];
const PARTY_NAMES=['Iron Wolves','Ember Company','Grey Lanterns','Thorn and Crow','Silver Pact'];
const QTYPES=[
  {k:'Monster hunt',w:{might:.6,agility:.25,wits:.15},f:(m)=>`Slay the ${m}`},
  {k:'Dungeon delve',w:{agility:.4,magic:.3,wits:.3},f:(m,p)=>`Delve into ${p}`},
  {k:'Escort',w:{might:.4,agility:.2,wits:.4},f:(m,p)=>`Escort a caravan past ${p}`},
  {k:'Arcane work',w:{magic:.6,wits:.4},f:(m,p)=>`Recover the relic of ${p}`},
  {k:'Bounty',w:{agility:.5,might:.3,wits:.2},f:(m,p)=>`Bounty: ${m} near ${p}`}
];
const MON=[
  ['Giant Rats','Goblin Scouts','Wolf Pack','Bog Imps'],
  ['Bandit Gang','Ogre','Skeleton Patrol','Harpies'],
  ['Cave Troll','Wraith','Young Drake','Cult Mages'],
  ['Demon Knight','Lich','Wyrm','Stone Giant'],
  ['Elder Dragon','Void Titan','Archdemon','Hydra Queen']
];
const PLACE=[
  ['the Old Cellar','Mossy Culvert','Farmer Hale’s Field','the Pale Woods'],
  ['Ashen Mine','Bandit Pass','the Sunken Crypt','Thornwood'],
  ['Gloam Keep','the Ruined Abbey','Cinder Fen','Frost Barrow'],
  ['Obsidian Citadel','the Drowned Temple','Bone Spire','the Ember Throne'],
  ['the Black Sun Vault','Worldsplit Chasm','the Dreaming Abyss','Dragon’s Crown']
];
const BOSSES=[
  {n:'Vorathrax, the Black Sun Dragon',place:'the Black Sun Vault',w:{might:.4,magic:.3,agility:.1,wits:.2},lore:'A dragon whose shadow has swallowed three towns.'},
  {n:'The Hollow King',place:'the Drowned Throne',w:{magic:.5,wits:.3,might:.2},lore:'A dead monarch who raises the drowned to his court.'},
  {n:'The Maw Beneath',place:'Worldsplit Chasm',w:{agility:.35,might:.35,wits:.3},lore:'Something vast has been chewing up the roads from below.'}
];
const ERAS=[
  {id:'plague',n:'Year of Plague',d:'Injuries last 1 day longer. Gold rewards +25%.',fx:{heal:1,gold:1.25}},

  shiftRep(h,o.r,ev);
  S.storyQ=S.storyQ.filter(id=>id!==h.id);
  S.log.unshift({d:S.day,t:`${h.name} shared a part of their past: ${o.l}. Trait gained: ${o.t}.`});
  ev.forEach(e=>S.log.unshift({d:S.day,t:e.t}));
  checkStory(h,null);
  ui.modal={type:'storydone',hid:h.id,ci,oi,extra:ev};
}

/* ---------- legacy (carries across runs) ---------- */
const calcLegacy=()=>rank()*10+Math.floor(S.stats.won/2)+Math.floor(S.day/10)+(S.vic?80:0);
function loadMeta(){
  M={legacy:0,total:0,perks:{},runs:[],hall:[]};
  try{const d=JSON.parse(localStorage.getItem(MKEY));if(d&&d.perks)M=d}catch(e){}
  M.hall=M.hall||[];
}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(M))}catch(e){}}
function bankLegacy(){
  if(S.paid)return;
  const gain=calcLegacy();
  S.paid=true;S.gain=gain;
  M.legacy+=gain;M.total+=gain;
  M.runs.unshift({day:S.day,rank:RANKS[rank()].l,won:S.stats.won,vic:!!S.vic,gain,era:era().n});
  M.runs=M.runs.slice(0,8);
  S.heroes.filter(h=>(h.story||[]).length>=2).sort((a,b)=>(b.rep||0)-(a.rep||0)).slice(0,3).forEach(h=>M.hall.unshift(hallEntry(h)));
  M.hall=M.hall.slice(0,12);
  saveMeta();
}

function missionCard(p){

    body=`<h2 class="${m.tone==='good'?'good':m.tone==='bad'?'bad':''}">${m.tone==='good'?'It works':m.tone==='bad'?'It goes wrong':'The party plays it safe'}</h2>
      <p>${esc(m.t)}</p>${m.extra.length?`<ul class="ev">${m.extra.map(e=>`<li class="${e.k}">${esc(e.t)}</li>`).join('')}</ul>`:''}
      <div class="mact"><button class="btn primary" data-act="next">Continue</button></div>`;dismiss=false;
  }else if(m.type==='offer'){
    const o=S.offers[0],h=o.hero,full=S.heroes.length>=rosterCap();
    body=`<h2>A visitor at the door</h2>
      <p><b class="hname t${h.tier}" style="display:inline">${esc(h.name)}</b>, a ${TIERS[h.tier].n} ${CLASSES[h.cls].n}, ${esc(o.why)}</p>
      ${heroCard(h,'',true)}
      ${full?'<p class="bad">Your roster is full. Release someone from the Roster tab first, or turn them away.</p>':''}
      <div class="mact"><button class="btn" data-act="decline">Turn away</button><button class="btn primary" data-act="accept" ${full?'disabled':''}>Welcome them</button></div>`;dismiss=false;
  }else if(m.type==='dossier'){
    const h=hero(m.hid);
    if(!h){ui.modal=null;return ''}
    const rt=repTier(h.rep||0);
    body=`<h2>${esc(h.name)}</h2>${heroCard(h,'',true)}
      <p class="cinfo">Reputation: <b class="${rt.cls}">${rt.n}</b> (${(h.rep||0)>0?'+':''}${h.rep||0}) · Leaning: <b>${alignTitle(h)}</b> · ${h.quests||0} quests finished. Wins raise reputation and losses lower it.</p>
      <div class="stack">${CHAPTERS.map((C,i)=>{
        const s=h.story[i];
        if(s){const o=C.o[s.o];return `<div class="chap"><div class="chead">Chapter ${i+1}: ${C.n} — ${o.l}</div><p>${esc(fillStory(o.s,h))}</p><div class="cinfo">Trait: <b>${o.t}</b>. ${o.d}</div></div>`}
        if(i===h.story.length&&h.pend)return `<div class="chap pend"><div class="chead">Chapter ${i+1}: ${C.n}</div><p class="cinfo">This chapter is ready to be written.</p><div><button class="btn primary small" data-act="story" data-a="${h.id}">Write this chapter</button></div></div>`;
        return `<div class="chap lock">Chapter ${i+1}: ??? Unlocks after ${C.at} finished quest${C.at>1?'s':''} (${Math.min(h.quests||0,C.at)}/${C.at}).</div>`;
      }).join('')}</div>
      <div class="mact"><button class="btn" data-act="close">Close</button></div>`;
  }else if(m.type==='story'){
    const h=hero(m.hid);
    if(!h||!h.pend){ui.modal=null;return ''}
    const ci=h.story.length,C=CHAPTERS[ci];
    const opts=C.o.map((o,i)=>({o,i})).filter(x=>!x.o.k||(x.o.k==='hi'&&h.rep>=40)||(x.o.k==='lo'&&h.rep<=-30));
    body=`<h2>Chapter ${ci+1}: ${C.n}</h2>
      <p>${esc(fillStory(C.intro,h))}</p>
      <p class="cinfo">Choose how this part of ${esc(h.name.split(' ')[0])}’s story reads. It becomes permanent, grants a trait and moves their reputation. A very high or very low reputation opens up different choices.</p>
      <div class="stack">${opts.map(({o,i})=>`<button class="sopt" data-act="storychoose" data-a="${h.id}" data-b="${i}">
        <b>${o.l}${o.k==='hi'?' <span class="tag vir">Legend</span>':o.k==='lo'?' <span class="tag aff">Infamy</span>':''}</b>
        <span class="stext">${esc(fillStory(o.s,h))}</span>
        <span class="cinfo">Trait: <b>${o.t}</b>. ${o.d} Reputation ${o.r>=0?'+':''}${o.r}. Leans ${o.m>0?'honorable':o.m<0?'ruthless':'pragmatic'}.</span></button>`).join('')}</div>
      <div class="mact"><button class="btn" data-act="later" data-a="${h.id}">Decide later</button></div>`;dismiss=false;
  }else if(m.type==='storydone'){
    const h=hero(m.hid),o=CHAPTERS[m.ci].o[m.oi];
    body=`<h2>${esc(o.l)}</h2><p>${esc(fillStory(o.s,h))}</p>
      <p class="cinfo">${esc(h.name.split(' ')[0])} gains <b>${o.t}</b>. ${o.d}${h.pend?' Another chapter is already waiting.':''}</p>
      ${m.extra.length?`<ul class="ev">${m.extra.map(e=>`<li class="${e.k}">${esc(e.t)}</li>`).join('')}</ul>`:''}
      <div class="mact"><button class="btn primary" data-act="next">Continue</button></div>`;dismiss=false;
  }else if(m.type==='victory'){
    const B=BOSSES[S.boss];dark=true;
    body=`<h2>${esc(B.n)} is slain</h2>
      <p>You led the guild from a ragged tavern to the end of the age. This run was won on day ${S.day-1}, at Rank ${RANKS[rank()].l}, with ${S.stats.won} quests completed.</p>
      <p>Retiring now earns <b class="good">${calcLegacy()} legacy points</b> for your next run. You can also keep playing and retire later.</p>
      <div class="mact"><button class="btn" data-act="close">Keep playing</button><button class="btn primary" data-act="claim">Retire and claim legacy</button></div>`;dismiss=false;
  }else if(m.type==='retire'){
    body=`<h2>Retire this run?</h2><p>You will earn <b class="good">${calcLegacy()} legacy points</b> and start a fresh guild. This guild is lost.</p>
      <div class="mact"><button class="btn" data-act="close">Keep playing</button><button class="btn danger" data-act="claim">Retire</button></div>`;
  }else if(m.type==='legacy'){
    dark=true;
    body=`<h2>Legacy</h2><p>Spendable points: <b class="good">${M.legacy}</b>${S.gain&&m.between?` (you just earned ${S.gain})`:''}. Perks carry into every future run.</p>
      <div class="stack">${PERKS.map(p=>{
        const lv=perk(p.id),max=p.cost.length,cost=p.cost[lv];
        return `<div class="arow"><div class="top"><b>${p.n}</b><span class="bpips">${p.cost.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</span></div>
          <div class="cinfo">${p.d}</div>
          ${lv<max?`<div><button class="btn small primary" data-act="buyperk" data-a="${p.id}" ${M.legacy<cost?'disabled':''}>Buy for ${cost}</button></div>`:'<div class="cinfo good">Owned</div>'}</div>`;
      }).join('')}</div>
      ${M.hall.length?`<div class="cinfo"><b>Hall of Legends:</b><br>${M.hall.slice(0,8).map(x=>`${esc(x.name)}, ${TIERS[x.tier].n} ${CLASSES[x.cls]?CLASSES[x.cls].n:''} · ${x.title}, ${repTier(x.rep).n}${x.fell?' (fell in service)':''}${x.traits.length?' · '+esc(x.traits.join(', ')):''}`).join('<br>')}</div>`:''}
      ${M.runs.length?`<div class="cinfo"><b>Past runs:</b><br>${M.runs.slice(0,5).map(r=>`${r.vic?'Victory':'Fell'} · day ${r.day} · Rank ${r.rank} · ${r.won} quests · ${esc(r.era)} · +${r.gain}`).join('<br>')}</div>`:''}
      <div class="mact">${m.between?`<button class="btn primary" data-act="begin">Begin a new run</button>`:`<button class="btn" data-act="close">Close</button>`}</div>`;dismiss=!m.between;
  }else if(m.type==='newgame'){
    body=`<h2>Start over?</h2><p>This ends your current guild and starts a new one. You keep the legacy points this run has earned (${calcLegacy()}).</p>
      <div class="mact"><button class="btn" data-act="close">Keep playing</button><button class="btn danger" data-act="claim">End run and restart</button></div>`;
  }else if(m.type==='over'){
    dark=true;
    body=`<h2>The guild has fallen</h2>${S.overReason?`<p class="bad">${esc(S.overReason)}</p>`:''}<p>You lasted ${S.day-1} days, won ${S.stats.won} quests, lost ${S.stats.lost}, and reached Rank ${RANKS[rank()].l}. ${S.stats.fallen} heroes died in your service.</p>
      <p>This run earns <b class="good">${calcLegacy()} legacy points</b>.</p>
      <div class="mact"><button class="btn primary" data-act="claim">Claim legacy and continue</button></div>`;dismiss=false;
  }
  return `<div class="back" ${dismiss?'data-act="backdrop"':''}><div class="modal${dark?' dark':''}" role="dialog" aria-modal="true">${body}</div></div>`;
}
function render(){
  const y=window.scrollY;
  const tabs=[['quests','Quests',S.board.length],['parties','Parties',S.parties.length],['roster','Roster',S.heroes.length,S.heroes.filter(h=>h.pend).length],['tavern','Tavern',null],['guild','Guild',null]];
  document.getElementById('app').innerHTML=`
    <div class="bar"><div class="logo">Guildmaster</div>
      <div class="chip"><small>Day</small><b>${S.day}</b></div>
      <div class="chip"><small>Gold</small><b class="${S.gold<0?'neg':''}">${S.gold}</b></div>
      <div class="speed" role="group" aria-label="Game speed">${[['0','Pause'],['1','1x'],['2','2x'],['4','4x']].map(s=>`<button class="${(ui.paused?'0':String(ui.speed))===s[0]?'on':''}" data-act="speed" data-a="${s[0]}">${s[1]}</button>`).join('')}</div>
      <div class="daymeter" title="Progress through the current day"><i id="dayfill" style="width:${ui.frac*100}%"></i></div></div>
    ${(()=>{
      const c=S.board.find(x=>x.crisis),m=S.parties.find(p=>p.mission&&p.mission.quest.crisis);
      if(c)return `<div class="crisisbar${c.expires<=5?' hot':''}"><span><b>CRISIS:</b> ${esc(c.title)}. <b>${c.expires} days</b> left to send a party.</span><button class="btn small" data-act="tab" data-a="quests">View</button></div>`;
      if(m)return `<div class="crisisbar"><span><b>CRISIS:</b> ${esc(m.name)} is facing "${esc(m.mission.quest.title)}". If they fail, the guild is lost.</span></div>`;
      return '';
    })()}
    ${renderRank()}
    <nav class="tabs">${tabs.map(t=>`<button class="tab ${ui.tab===t[0]?'on':''}" data-act="tab" data-a="${t[0]}">${t[1]}${t[2]!==null?`<em>${t[2]}</em>`:''}${t[3]?'<span class="pill good" style="margin-left:6px">Story</span>':''}</button>`).join('')}</nav>
    ${renderTab()}
    <section class="ledger"><h2>Guild ledger</h2><ol>${S.log.slice(0,8).map(l=>`<li><span>Day ${l.d}</span>${esc(l.t)}</li>`).join('')}</ol></section>
    <div class="foot"><button class="btn small" data-act="hardcore">Heroes can die: ${S.hardcore?'ON':'OFF'}</button><button class="btn small" data-act="help">How to play</button><button class="btn small" data-act="legacy">Legacy</button><button class="btn small" data-act="retire">Retire run</button></div>
    ${renderModal()}`;
  window.scrollTo(0,y);
  renderToasts();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}

/* ---------- live clock ---------- */
const DAY_MS=7000;
function renderToasts(){
  const box=document.getElementById('toasts');
  box.innerHTML=ui.toasts.map(t=>`<div class="toast ${t.k}" data-toast="${t.id}">${esc(t.t)}</div>`).join('');
}
function tickUI(){
  const f=document.getElementById('dayfill');
  if(f)f.style.width=ui.frac*100+'%';
  S.parties.forEach(p=>{
    if(!p.mission)return;
    const v=progress(p)+'%';
    document.querySelectorAll(`.runner[data-pid="${p.id}"]`).forEach(el=>el.style.left=v);
    document.querySelectorAll(`.fill[data-pid="${p.id}"]`).forEach(el=>el.style.width=v);
  });
  const n=ui.toasts.length;
  ui.toasts=ui.toasts.filter(t=>t.until>Date.now());
  if(ui.toasts.length!==n)renderToasts();
}
let lastT=performance.now();
function loop(){
  const now=performance.now(),dt=Math.min(250,now-lastT);lastT=now;
  if(!S)return;
  if(S.over||ui.modal||ui.paused||document.hidden){tickUI();return}
  ui.frac+=dt*ui.speed/DAY_MS;
  if(ui.frac>=1){ui.frac=0;endDay();render()}
  else tickUI();
}
setInterval(loop,100);

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='backdrop'&&e.target!==el)return;
  const a=el.dataset.a,b=el.dataset.b;
  switch(el.dataset.act){
    case 'tab':ui.tab=a;ui.modal=null;ui.confirm=null;break;
    case 'speed':if(a==='0')ui.paused=true;else{ui.paused=false;ui.speed=+a}break;
    case 'assign':ui.modal={type:'assign',qid:a};break;
    case 'send':{
      const q=S.board.find(x=>x.id==a),p=party(+b);
      if(q&&p&&!p.mission&&p.members.length&&!members(p).some(unavailable)){
        p.mission={quest:q,daysLeft:q.days,total:q.days,mom:0,used:[],ev:[]};
        S.board=S.board.filter(x=>x!==q);
        S.log.unshift({d:S.day,t:`${p.name} set out on "${q.title}".`});
      }
      ui.modal=null;break;
    }
    case 'decide':decide(+a);break;
    case 'addslot':ui.modal={type:'addmember',pid:+a};break;
    case 'addhero':{
      const p=party(+a),h=hero(+b);
      if(p&&h&&!p.mission&&p.members.length<4&&!h.party){p.members.push(h.id);h.party=p.id}
      if(p&&p.members.length>=4)ui.modal=null;
      break;
    }
    case 'remove':{
      const h=hero(+a),p=h&&party(h.party);
      if(p&&!p.mission){p.members=p.members.filter(id=>id!==h.id);h.party=null}
      break;
    }
    case 'hire':{
      const h=S.tavern.find(x=>x.id==a);
      if(h&&S.gold>=h.cost&&S.heroes.length<rosterCap()){
        S.gold-=h.cost;S.tavern=S.tavern.filter(x=>x!==h);delete h.cost;S.heroes.push(h);
        S.log.unshift({d:S.day,t:`Hired ${h.name}, a ${TIERS[h.tier].n} ${CLASSES[h.cls].n}.`});
      }
      break;
    }
    case 'reroll':if(S.gold>=20){S.gold-=20;S.tavern=[];refreshTavern(0)}break;
    case 'release':{
      const h=hero(+a);
      if(ui.confirm===h.id){
        S.heroes=S.heroes.filter(x=>x!==h);
        S.parties.forEach(p=>p.members=p.members.filter(id=>id!==h.id));
        S.log.unshift({d:S.day,t:`Released ${h.name}.`});ui.confirm=null;
      }else ui.confirm=h.id;
      break;
    }
    case 'relax':ui.modal={type:'relax',hid:+a};break;
    case 'dossier':ui.modal={type:'dossier',hid:+a};break;
    case 'story':ui.modal={type:'story',hid:+a,from:'dossier'};break;
    case 'storychoose':{const h=hero(+a);if(h&&h.pend)chooseChapter(h,+b);break}
    case 'later':{
      const from=ui.modal&&ui.modal.from;
      S.storyQ=S.storyQ.filter(id=>id!==+a);
      if(from==='dossier')ui.modal={type:'dossier',hid:+a};else nextModal();
      break;
    }
    case 'relief':{
      const h=hero(+a),o=h&&reliefOpts(h).find(x=>x.id===b);
      if(h&&o&&S.gold>=o.cost&&status(h)!=='questing'){
        S.gold-=o.cost;h.rest=1;
        const ev=[];addStress(h,-o.amt,[h],ev);
        S.log.unshift({d:S.day,t:`${h.name} takes a day to relax (${o.n}). Stress -${o.amt}.`});
        ev.forEach(x=>S.log.unshift({d:S.day,t:x.t}));
      }
      ui.modal=null;break;
    }
    case 'build':{
      const b0=BLD.find(x=>x.id===a),cost=b0.cost[bl(a)];
      if(cost!==undefined&&S.gold>=cost){S.gold-=cost;S.bld[a]=bl(a)+1;S.log.unshift({d:S.day,t:`${b0.n} upgraded to level ${S.bld[a]}.`})}
      break;
    }
    case 'accept':{
      const o=S.offers[0];
      if(o&&S.heroes.length<rosterCap()){S.heroes.push(o.hero);S.offers.shift();S.log.unshift({d:S.day,t:`${o.hero.name} joined the guild.`});nextModal()}
      break;
    }
    case 'decline':S.offers.shift();nextModal();break;
    case 'next':nextModal();break;
    case 'close':case 'backdrop':ui.modal=null;break;
    case 'hardcore':S.hardcore=!S.hardcore;break;
    case 'help':ui.modal={type:'intro'};break;
    case 'legacy':ui.modal={type:'legacy'};break;
    case 'retire':ui.modal={type:'retire'};break;
    case 'claim':bankLegacy();ui.modal={type:'legacy',between:true};break;
    case 'buyperk':{
      const p=PERKS.find(x=>x.id===a),cost=p.cost[perk(a)];
      if(cost!==undefined&&M.legacy>=cost){M.legacy-=cost;M.perks[a]=perk(a)+1;saveMeta()}
      break;
    }
    case 'begin':{const first=!M.runs.length;newGame();ui={tab:'quests',modal:first?{type:'intro'}:null,confirm:null,speed:1,paused:true,frac:0,toasts:[]};break}
  }
  if(el.dataset.act!=='release'&&el.dataset.act!=='tab')ui.confirm=null;
  render();
});

/* ---------- boot ---------- */
loadMeta();
let loaded=false;
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw);if(d&&d.v===2&&Array.isArray(d.heroes)){S=d;loaded=true}}
}catch(e){}
if(loaded){
  S.storyQ=S.storyQ||[];
  if(S.nextCrisis===undefined)S.nextCrisis=S.day+ri(10,16);
  S.heroes.forEach(h=>{h.rep=h.rep||0;h.quests=h.quests||0;h.story=h.story||[];h.pend=!!h.pend});
  S.fallen.forEach(f=>{f.title=f.title||'';f.rep=f.rep||'Unknown'});
}
if(!loaded){newGame();ui.modal={type:'intro'}}
else nextModal();
render();
})();
</script>

</body>
</html>
